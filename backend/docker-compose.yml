services:
  db:
    image: postgres:15-alpine
    container_name: polban-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: compliance_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: .
    container_name: polban-compliance-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Arahkan ke service 'db' di atas
      - DATABASE_URL=postgresql+asyncpg://admin:secretpassword@db:5432/compliance_db
      - CHROMA_DB_PATH=/app/data/chroma_db
      - UPLOAD_DIR=/app/data/uploads
      - ENVIRONMENT=production
      # Data kriteria resmi: path DI LUAR volume app_data agar selalu segar per build
      - KRITERIA_JSON_PATH=/app/kriteria/kriteria_prodi.json
    volumes:
      - app_data:/app/data
    depends_on:
      - db
    restart: unless-stopped

volumes:
  app_data:
  pg_data:
